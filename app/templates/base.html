<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}PocketSmart AI{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-bar">
        <a href="/" class="brand">PocketSmart AI</a>
        <nav class="main-nav">
          {% if user %}
            <a href="/dashboard">Dashboard</a>
            <a href="/history">History</a>
            <a href="/planner/trip">Trip Planner</a>
            <a href="/planner/home">Home Planner</a>
            <a href="/planner/party">Party Planner</a>
            <a href="/planner/jewelry">Jewelry Planner</a>
            <a href="/logout">Logout</a>
          {% else %}
            <a href="/">Home</a>
            <a href="/login">Login</a>
            <a href="/register">Register</a>
          {% endif %}
        </nav>
      </div>
    </header>

    <main class="container main-shell">
      {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', path='js/app.js') }}"></script>
  </body>
</html>
